name: Publish a verified YouTube upload immediately

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "The channel that owns the already-uploaded video"
        type: choice
        required: true
        options: [astrotobby, digital_nomad]
      video_id:
        description: "Existing YouTube video ID to make public"
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish-now:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout AI-GEMS configuration
        uses: actions/checkout@v4
      - name: Restore channel-specific YouTube OAuth credentials
        uses: actions/cache/restore@v4
        with:
          path: whop-clipper/work
          key: publish-yt-${{ github.run_id }}
          restore-keys: |
            clipper-auth-
      - name: Checkout long-form pipeline
        uses: actions/checkout@v4
        with:
          repository: astrotobby/astro-blog
          ref: main
          path: astro-blog
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YouTube API client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth
      - name: Verify channel ownership and make the existing upload public
        working-directory: whop-clipper
        env:
          CHANNEL: ${{ inputs.channel }}
          VIDEO_ID: ${{ inputs.video_id }}
          YOUTUBE_REFRESH_TOKEN_ASTRO_TOBBY: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ASTRO_TOBBY }}
          YOUTUBE_REFRESH_TOKEN_DIJITOL_NOMAD: ${{ secrets.YOUTUBE_REFRESH_TOKEN_DIJITOL_NOMAD }}
          REFRESHTOKEN_DIJITOLNOMAD: ${{ secrets.REFRESHTOKEN_DIJITOLNOMAD }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          YOUTUBECLIENT_ID: ${{ secrets.YOUTUBECLIENT_ID }}
          YOUTUBECLIENT_SECTRET: ${{ secrets.YOUTUBECLIENT_SECTRET }}
        run: |
          python - <<'PY'
          import os
          from clipper import publish
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          channel = os.environ["CHANNEL"]
          video_id = os.environ["VIDEO_ID"].strip()
          if not video_id or len(video_id) > 32:
              raise SystemExit("Invalid video ID")

          expected = {
              "astrotobby": ("Astro Tobby", "UCxndvpcFaVhN1bJxgWIjG_A"),
              "digital_nomad": ("DIJITOL NOMAD", "UCE_cklDludc6nkU1_4K6JzA"),
          }
          name, expected_id = expected[channel]
          import tomllib
          from pathlib import Path
          cfg = tomllib.loads(Path("config.toml").read_text(encoding="utf-8"))
          target = next((t for t in cfg.get("targets", [])
                         if t.get("platform") == "youtube" and
                         (t.get("channel") or "").casefold() == name.casefold()), None)
          if not target:
              raise SystemExit(f"Missing configured YouTube target: {name}")

          creds = publish._yt_creds(target)
          if not creds:
              raise SystemExit(f"No usable YouTube OAuth credentials for {name}")
          access = publish._yt_access_token(creds)
          cid, secret, refresh = creds
          credentials = Credentials(
              token=access, refresh_token=refresh,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=cid, client_secret=secret,
          )
          yt = build("youtube", "v3", credentials=credentials, cache_discovery=False)
          channels = yt.channels().list(part="id,snippet", mine=True).execute().get("items") or []
          if not channels:
              raise SystemExit("OAuth returned no YouTube channel")
          actual = channels[0]
          actual_name = (actual.get("snippet") or {}).get("title", "")
          if actual.get("id") != expected_id:
              raise SystemExit(f"Wrong OAuth destination: {actual_name} / {actual.get('id')}; expected channel ID {expected_id}")

          found = yt.videos().list(part="snippet,status", id=video_id).execute().get("items") or []
          if not found:
              raise SystemExit(f"Video {video_id} is not visible to the authenticated channel")
          video = found[0]
          snippet = video.get("snippet") or {}
          if snippet.get("channelId") != expected_id:
              raise SystemExit("Safety stop: the video belongs to a different channel")
          print(f"Verified owner: {actual_name}; video title: {snippet.get('title','')}")
          current = video.get("status") or {}
          if current.get("privacyStatus") != "public":
              yt.videos().update(
                  part="status",
                  body={"id": video_id, "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": bool(current.get("selfDeclaredMadeForKids", False)),
                  }},
              ).execute()
          verified = yt.videos().list(part="snippet,status", id=video_id).execute().get("items") or []
          if not verified or (verified[0].get("status") or {}).get("privacyStatus") != "public":
              raise SystemExit("YouTube did not confirm public visibility")
          print("PUBLIC_VERIFIED")
          print(f"Channel: {name}")
          print(f"Title: {(verified[0].get('snippet') or {}).get('title','')}")
          print(f"Video ID: {video_id}")
          print(f"URL: https://youtu.be/{video_id}")
          PY
