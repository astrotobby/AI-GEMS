name: Daily long-form YouTube

on:
  schedule:
    - cron: "17 3 * * *"  # 06:17 EAT start -> next-day Astro Tobby 10:00 EAT release
    - cron: "23 5 * * *"  # 08:23 EAT start -> next-day DIJITOL NOMAD 12:00 EAT release
    - cron: "29 8 * * *"  # 11:29 EAT start -> next-day Astro Tobby 15:00 EAT release
    - cron: "37 11 * * *" # 14:37 EAT start -> next-day DIJITOL NOMAD 18:00 EAT release
  workflow_call:
    inputs:
      channel:
        description: "YouTube destination"
        type: string
        required: true
      slot:
        description: "Kenya publication time"
        type: string
        required: true
      target_date:
        description: "Kenya publication date (YYYY-MM-DD)"
        type: string
        required: false
      dry_run:
        description: "Render and validate but do not upload"
        type: boolean
        required: true
      publish_now:
        description: "Publish this run's newly rendered video immediately after YouTube processing and thumbnail QA"
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      channel:
        description: "YouTube destination"
        type: choice
        required: true
        default: astrotobby
        options: [astrotobby, digital_nomad]
      slot:
        description: "Kenya publication time"
        type: choice
        required: true
        default: "10:00"
        options: ["10:00", "12:00", "15:00", "18:00"]
      target_date:
        description: "Optional Kenya date (YYYY-MM-DD); blank means next future matching slot"
        type: string
        required: false
      dry_run:
        description: "Research, script, render and validate but DO NOT upload"
        type: boolean
        required: true
        default: true
      publish_now:
        description: "Publish this run's newly rendered video immediately after processing and thumbnail QA"
        type: boolean
        required: false
        default: false
        default: false

permissions:
  contents: write

concurrency:
  # All four slots share one visual-history cache. Serialize them so two
  # fresh runners can never restore the same old history and overwrite each other.
  group: longform-global-visual-history
  cancel-in-progress: false

jobs:
  render-and-publish:
    # The owner-approved LONGFORM_LIVE_ENABLED repository variable is the single live-publishing master switch.
    # Scheduled runs fail closed while it is unset or anything other than the literal string 'true'.
    if: ${{ github.event_name != 'schedule' || vars.LONGFORM_LIVE_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LONGFORM_STATE_DIR: ${{ github.workspace }}/whop-clipper/state/longform
      LONGFORM_MODEL: ${{ vars.LONGFORM_MODEL || 'claude-sonnet-5' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.7-flash' }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_TTS_FUNCTION_ID: ${{ vars.NVIDIA_TTS_FUNCTION_ID || '877104f7-e885-42b9-8de8-f6e4c6303969' }}
      NVIDIA_TTS_VOICE: ${{ vars.NVIDIA_TTS_VOICE || 'Magpie-Multilingual.EN-US.Jason' }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_FALLBACK_MODELS: ${{ vars.OPENCODE_FALLBACK_MODELS || 'opencode/nemotron-3.5-lightning-free,opencode/deepseek-v4.1-flash-free,opencode/mimo-v2.6-flash-free,opencode/nemotron-3.5-super-vl-free,opencode/beam-free,opencode/big-pickle' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: astrotobby
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YOUTUBE_OAUTH_ASTRO_TOBBY_JSON: ${{ secrets.YOUTUBE_OAUTH_ASTRO_TOBBY_JSON }}
      YOUTUBE_OAUTH_DIJITOL_NOMAD_JSON: ${{ secrets.YOUTUBE_OAUTH_DIJITOL_NOMAD_JSON }}
      YOUTUBE_REFRESH_TOKEN_ASTRO_TOBBY: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ASTRO_TOBBY }}
      YOUTUBE_REFRESH_TOKEN_DIJITOL_NOMAD: ${{ secrets.YOUTUBE_REFRESH_TOKEN_DIJITOL_NOMAD }}
      REFRESHTOKEN_DIJITOLNOMAD: ${{ secrets.REFRESHTOKEN_DIJITOLNOMAD }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      YOUTUBECLIENT_ID: ${{ secrets.YOUTUBECLIENT_ID }}
      YOUTUBECLIENT_SECTRET: ${{ secrets.YOUTUBECLIENT_SECTRET }}
    steps:
      - name: Checkout AI-GEMS (credential and scheduler repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore legacy YouTube OAuth cache (temporary fallback)
        uses: actions/cache/restore@v4
        with:
          path: |
            whop-clipper/work
            ~/.cache/huggingface
          key: longform-yt-${{ github.run_id }}
          restore-keys: |
            clipper-auth-

      - name: Restore permanent encrypted YouTube OAuth secrets when configured
        env:
          YOUTUBE_OAUTH_ASTRO_TOBBY_JSON: ${{ secrets.YOUTUBE_OAUTH_ASTRO_TOBBY_JSON }}
          YOUTUBE_OAUTH_DIJITOL_NOMAD_JSON: ${{ secrets.YOUTUBE_OAUTH_DIJITOL_NOMAD_JSON }}
        run: python .github/scripts/youtube_oauth_secret_storage.py --restore

      - name: Checkout astro-blog production pipeline
        uses: actions/checkout@v4
        with:
          repository: astrotobby/astro-blog
          ref: ${{ github.ref_name }}
          path: astro-blog
          persist-credentials: false

      # This cache contains non-secret provider IDs and perceptual hashes, not credentials.
      # Keep visual no-repeat history shared by both channels across fresh cloud runners.
      - name: Restore cross-run visual asset history
        uses: actions/cache/restore@v4
        with:
          path: |
            astro-blog/.pipeline/state/footage_history.json
            astro-blog/.pipeline/state/footage_search_cache.json
          key: visual-assets-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            visual-assets-${{ github.ref_name }}-

      - name: Restore canonical cross-channel visual registry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p whop-clipper/state/longform astro-blog/.pipeline/state
          if [ -f whop-clipper/state/longform/visual_registry.json ]; then
            cp whop-clipper/state/longform/visual_registry.json astro-blog/.pipeline/state/footage_history.json
          elif [ ! -f astro-blog/.pipeline/state/footage_history.json ]; then
            printf '{"items":[]}\n' > astro-blog/.pipeline/state/footage_history.json
          fi

      - name: Seed duplicate-scene exclusions and verify visual history
        working-directory: astro-blog
        run: python scripts/seed_footage_history.py --ledger ../whop-clipper/state/longform/ledger.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: astro-blog/requirements-longform.txt

      - name: Install OpenCode CLI for free-model fallback
        if: env.OPENCODE_API_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @opencode/cli
          opencode --version

      - name: Install FFmpeg
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3
        with:
          version: release
          token: ${{ github.token }}

      - name: Install long-form Python dependencies
        run: python -m pip install --disable-pip-version-check -r astro-blog/requirements-longform.txt

      # MuseTalk 1.5 is the required production presenter engine. It runs
      # on Kaggle's free NvidiaTeslaT4 pool, not on the GitHub CPU runner.
      - name: Install Kaggle CLI for private MuseTalk GPU batches
        run: python -m pip install --disable-pip-version-check "kaggle==2.2.5"

      - name: Require Kaggle credentials before research or rendering
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo "::error::Missing KAGGLE_API_TOKEN in astrotobby/AI-GEMS Actions secrets."
            echo "Add the same Kaggle token used by astro-blog under Settings > Secrets and variables > Actions."
            echo "The long-form pipeline will not fall back to Wav2Lip or unsynchronized presenter footage."
            exit 1
          fi
          echo "Kaggle token is present; its value is never printed."

      - name: Validate the two approved presenter clips
        working-directory: astro-blog
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path("assets/influencer/looks.yaml").read_text())
          looks = data.get("looks", [])
          approved = [item for item in looks if item.get("lip_sync") and item.get("clip")]
          if len(approved) < 2:
              raise SystemExit(f"Expected at least two approved moving presenter looks, found {len(approved)}.")
          for look in approved:
              clip = Path(look["clip"])
              if not clip.is_file() or clip.stat().st_size < 100_000:
                  raise SystemExit(f"Approved presenter clip is missing or too small: {clip}")
              print(f"Presenter look ready: {look['id']} ({clip.stat().st_size:,} bytes)")
          PY

      - name: Validate both YouTube channel credentials before rendering
        working-directory: whop-clipper
        run: python validate_youtube_channels.py

      - name: Verify visual no-repeat guard before rendering
        working-directory: astro-blog
        run: |
          python -m py_compile scripts/generate_video.py scripts/build_script.py scripts/seed_footage_history.py
          python scripts/test_video_pipeline.py VisualDuplicateGuardTests

      - name: Resolve the channel and publication slot
        id: slot
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE_CRON" in
              "17 3 * * *") CHANNEL="astrotobby"; SLOT="10:00" ;;
              "23 5 * * *") CHANNEL="digital_nomad"; SLOT="12:00" ;;
              "29 8 * * *") CHANNEL="astrotobby"; SLOT="15:00" ;;
              "37 11 * * *") CHANNEL="digital_nomad"; SLOT="18:00" ;;
              *) echo "Unknown scheduled trigger: $GITHUB_EVENT_SCHEDULE" >&2; exit 1 ;;
            esac
            TARGET_DATE="$(TZ=Africa/Nairobi date -d tomorrow +%F)"
            DRY_RUN="false"
            PUBLISH_NOW="false"
          else
            CHANNEL="${{ inputs.channel || github.event.inputs.channel }}"
            SLOT="${{ inputs.slot || github.event.inputs.slot }}"
            TARGET_DATE="${{ inputs.target_date || github.event.inputs.target_date }}"
            DRY_RUN="${{ inputs.dry_run || github.event.inputs.dry_run }}"
            PUBLISH_NOW="${{ inputs.publish_now || github.event.inputs.publish_now || 'false' }}"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "publish_now=$PUBLISH_NOW" >> "$GITHUB_OUTPUT"
          echo "Selected $CHANNEL / $SLOT EAT / target date ${TARGET_DATE:-next future slot} / dry-run=$DRY_RUN / publish-now=$PUBLISH_NOW"

      - name: Require explicit approval for any live publication
        shell: bash
        env:
          DRY_RUN: ${{ steps.slot.outputs.dry_run }}
          PUBLISH_NOW: ${{ steps.slot.outputs.publish_now }}
          LONGFORM_LIVE_ENABLED: ${{ vars.LONGFORM_LIVE_ENABLED }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_NOW" = "true" ] && [ "$DRY_RUN" = "true" ]; then
            echo "Immediate publication cannot run in dry-run mode."
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ] && [ "$LONGFORM_LIVE_ENABLED" != "true" ]; then
            echo "Live publishing blocked: set the LONGFORM_LIVE_ENABLED repository variable to the literal string true."
            exit 1
          fi
          echo "Live publishing master switch verified (or dry-run mode selected)."

      - name: Verify expected account routing before research
        working-directory: whop-clipper
        env:
          CHANNEL: ${{ steps.slot.outputs.channel }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          if not os.environ.get("GEMINI_API_KEY"):
              raise SystemExit("Missing GEMINI_API_KEY secret in AI-GEMS. Add the existing Gemini key from astro-blog to this repository's Actions secrets.")
          channel = os.environ["CHANNEL"]
          expected = {"astrotobby": ("Astro Tobby", "goodlucktobby@gmail.com"),
                      "digital_nomad": ("DIJITOL NOMAD", "chanzera3@gmail.com")}
          name, account = expected[channel]
          cfg = tomllib.loads(Path("config.toml").read_text(encoding="utf-8"))
          targets = [t for t in cfg.get("targets", []) if t.get("platform") == "youtube"]
          target = next((t for t in targets if (t.get("channel") or "").casefold() == name.casefold()), None)
          assert target, f"Missing YouTube target: {name}"
          if channel == "digital_nomad" and target.get("channel_id") != "UCE_cklDludc6nkU1_4K6JzA":
              raise SystemExit("DIJITOL NOMAD channel ID does not match the configured owner channel")
          print(f"Destination configured: {name}; owner mapping: {account}; channel ID: {target.get('channel_id', 'not set')}")
          PY

      - name: Test FreeLLMAPI sidecar bootstrap
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          python -m py_compile scripts/freellmapi_sidecar.py scripts/test_freellmapi_sidecar.py
          python -m unittest discover -s scripts -p "test_freellmapi_sidecar.py"

      - name: Start optional FreeLLMAPI fallback for manual dry-runs
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        env:
          FREELLMAPI_ENABLED: "true"
        run: python scripts/freellmapi_sidecar.py

      - name: Run end-to-end long-form pipeline
        working-directory: whop-clipper
        env:
          CHANNEL: ${{ steps.slot.outputs.channel }}
          SLOT: ${{ steps.slot.outputs.slot }}
          TARGET_DATE: ${{ steps.slot.outputs.target_date }}
          DRY_RUN: ${{ steps.slot.outputs.dry_run }}
          PUBLISH_NOW: ${{ steps.slot.outputs.publish_now }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--channel "$CHANNEL" --slot "$SLOT")
          if [ -n "$TARGET_DATE" ]; then ARGS+=(--target-date "$TARGET_DATE"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$PUBLISH_NOW" = "true" ]; then ARGS+=(--publish-now); fi
          python ../astro-blog/scripts/longform_pipeline.py "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/longform-result.txt"

      - name: Create public handoff asset for Facebook and manual Rumble handoff
        if: success() && steps.slot.outputs.dry_run != 'true'
        continue-on-error: true
        working-directory: whop-clipper
        env:
          CHANNEL: ${{ steps.slot.outputs.channel }}
          SLOT: ${{ steps.slot.outputs.slot }}
          TARGET_DATE: ${{ steps.slot.outputs.target_date }}
          GH_TOKEN: ${{ github.token }}
        run: python ../astro-blog/scripts/create_longform_social_release.py

      # Persist canonical visual history to Git as well as the best-effort Actions cache.
      # Contains public asset IDs and perceptual hashes only; never credentials.
      - name: Commit canonical cross-channel visual registry
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="astro-blog/.pipeline/state/footage_history.json"
          REGISTRY="whop-clipper/state/longform/visual_registry.json"
          SNAPSHOT="$RUNNER_TEMP/rendered-visual-registry.json"
          REMOTE_SNAPSHOT="$RUNNER_TEMP/remote-visual-registry.json"
          mkdir -p whop-clipper/state/longform

          if [ ! -f "$SOURCE" ]; then
            echo "No rendered visual-history file exists; nothing to persist."
            exit 0
          fi

          # Freeze this run's full history before syncing Git. It includes the
          # restored canonical registry, ledger seeding, and any newly accepted visuals.
          cp "$SOURCE" "$SNAPSHOT"
          python .github/scripts/merge_visual_registry.py \
            --output "$RUNNER_TEMP/validated-visual-registry.json" "$SNAPSHOT"
          cp "$RUNNER_TEMP/validated-visual-registry.json" "$SNAPSHOT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$SNAPSHOT" "$REGISTRY"
          git add "$REGISTRY"
          if ! git diff --cached --quiet; then
            git commit -m "Persist global visual no-reuse registry"
          fi

          # A run may finish after another video render or a repository merge.
          # Merge the latest branch and union registry entries before every push.
          for attempt in 1 2 3 4 5; do
            echo "Synchronizing canonical visual history (attempt $attempt/5)"
            git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"

            if ! git merge --no-edit --no-ff "refs/remotes/origin/${GITHUB_REF_NAME}"; then
              unresolved="$(git diff --name-only --diff-filter=U)"
              if [ "$unresolved" != "$REGISTRY" ]; then
                echo "Unexpected merge conflict outside the visual registry:"
                printf '%s\n' "$unresolved"
                git merge --abort || true
                exit 1
              fi

              git show "refs/remotes/origin/${GITHUB_REF_NAME}:$REGISTRY" > "$REMOTE_SNAPSHOT"
              python .github/scripts/merge_visual_registry.py \
                --output "$REGISTRY" "$REMOTE_SNAPSHOT" "$SNAPSHOT"
              git add "$REGISTRY"
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                echo "Visual registry merge did not resolve every conflict." >&2
                git merge --abort || true
                exit 1
              fi
              git -c core.editor=true commit --no-edit
            fi

            git show "refs/remotes/origin/${GITHUB_REF_NAME}:$REGISTRY" > "$REMOTE_SNAPSHOT"
            python .github/scripts/merge_visual_registry.py \
              --output "$REGISTRY" "$REMOTE_SNAPSHOT" "$SNAPSHOT" "$REGISTRY"
            git add "$REGISTRY"
            if ! git diff --cached --quiet; then
              git commit -m "Merge cross-channel visual asset history"
            fi

            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              echo "Canonical cross-channel visual registry persisted successfully."
              exit 0
            fi
            echo "Push raced with another branch update; fetching and merging again."
          done

          echo "Could not persist visual history after five synchronization attempts." >&2
          exit 1
      # Save only non-secret visual search/history files; leave OAuth and other state untouched.
      - name: Persist cross-run visual asset history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            astro-blog/.pipeline/state/footage_history.json
            astro-blog/.pipeline/state/footage_search_cache.json
          key: visual-assets-${{ github.ref_name }}-${{ github.run_id }}

      - name: Preserve rendered video and job result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longform-${{ steps.slot.outputs.channel || 'manual' }}-${{ github.run_id }}
          path: |
            astro-blog/.pipeline/out/video_16x9.mp4
            astro-blog/.pipeline/out/thumb-*.jpg
            astro-blog/.pipeline/out/longform_*.json
            whop-clipper/state/longform/ledger.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Write workflow summary
        if: always()
        env:
          CHANNEL: ${{ steps.slot.outputs.channel }}
          SLOT: ${{ steps.slot.outputs.slot }}
          TARGET_DATE: ${{ steps.slot.outputs.target_date }}
          DRY_RUN: ${{ steps.slot.outputs.dry_run }}
        run: |
          {
            echo "## Long-form YouTube job"
            echo ""
            printf "%s\\n" "- Channel: ${CHANNEL}"
            printf "%s\\n" "- Publication slot: ${SLOT} Kenya time"
            printf "%s\\n" "- Target date: ${TARGET_DATE:-next future slot}"
            printf "%s\\n" "- Dry run: ${DRY_RUN}"
            echo ""
            if [ -f "$RUNNER_TEMP/longform-result.txt" ]; then
              echo '```json'
              cat "$RUNNER_TEMP/longform-result.txt"
              echo '```'
            else
              echo "Pipeline did not produce a result JSON. Check the failed step logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove expired social handoff releases
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release list --repo astrotobby/AI-GEMS --limit 100 --json tagName,createdAt \
            | jq -r '.[] | select(.tagName | startswith("social-handoff-")) | select((now - (.createdAt | fromdateiso8601)) > 604800) | .tagName' \
            | while IFS= read -r tag; do
                [ -z "$tag" ] && continue
                gh release delete "$tag" --repo astrotobby/AI-GEMS --yes --cleanup-tag || true
              done

      - name: Stop and remove temporary FreeLLMAPI sidecar
        if: always()
        run: python scripts/freellmapi_sidecar.py --cleanup
