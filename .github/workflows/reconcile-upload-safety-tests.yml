name: Existing long-form upload reconciliation tests

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/reconcile_existing_longform_upload.py"
      - ".github/scripts/test_reconcile_existing_longform_upload.py"
      - ".github/scripts/verify_youtube_publications.py"
      - ".github/scripts/test_verify_youtube_publications.py"
      - ".github/workflows/reconcile-existing-longform-upload.yml"
      - ".github/workflows/verify-youtube-publications.yml"
      - ".github/workflows/reconcile-upload-safety-tests.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/reconcile_existing_longform_upload.py"
      - ".github/scripts/test_reconcile_existing_longform_upload.py"
      - ".github/scripts/verify_youtube_publications.py"
      - ".github/scripts/test_verify_youtube_publications.py"
      - ".github/workflows/verify-youtube-publications.yml"
      - ".github/workflows/reconcile-upload-safety-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal YouTube API dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
      - name: Compile YouTube recovery and publication verification code
        run: |
          python -m py_compile \
            .github/scripts/reconcile_existing_longform_upload.py \
            .github/scripts/test_reconcile_existing_longform_upload.py \
            .github/scripts/verify_youtube_publications.py \
            .github/scripts/test_verify_youtube_publications.py

      - name: Run offline existing-upload recovery safety tests
        run: python -m unittest discover -s .github/scripts -p 'test_reconcile_existing_longform_upload.py' -v

      - name: Run offline scheduled-publication safety tests
        run: python -m unittest discover -s .github/scripts -p 'test_verify_youtube_publications.py' -v
