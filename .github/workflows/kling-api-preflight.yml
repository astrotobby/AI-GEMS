name: Kling API key-pool preflight (no credits spent)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kling-api-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KLING_API_KEYS: ${{ secrets.KLING_API_KEYS }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Install request client
        run: python -m pip install --disable-pip-version-check requests
      - name: Check all stored accounts and supported Omni models (no generation calls)
        run: python scripts/kling_api_preflight.py
