name: Influencer Kling API preflight (no credits spent)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KLING_API_KEYS: ${{ secrets.KLING_API_KEYS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only check dependencies
        run: python -m pip install --disable-pip-version-check "requests>=2.32,<3" "Pillow>=10,<13"
      - name: Verify first designated account and Kling 4.0 package
        run: python scripts/check_kling_api_credentials.py
