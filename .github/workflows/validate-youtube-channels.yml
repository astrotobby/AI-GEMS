name: validate-youtube-channels

# Manual, read-only channel credential check. This workflow never uploads videos.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout AI-GEMS (credential owner)
        uses: actions/checkout@v4

      # The YouTube auth workflow persists each channel's issuing OAuth client
      # beside its refresh token. Restore that cache so refreshes use the exact
      # client that minted the token instead of guessing across current client IDs.
      - name: Restore YouTube OAuth token/client cache
        uses: actions/cache/restore@v4
        with:
          path: whop-clipper/work
          key: clipper-auth-restore
          restore-keys: |
            clipper-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal YouTube API dependencies
        run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2

      - name: Verify both channel credentials (read-only)
        working-directory: whop-clipper
        env:
          YOUTUBE_REFRESH_TOKEN_ASTRO_TOBBY: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ASTRO_TOBBY }}
          YOUTUBE_REFRESH_TOKEN_DIJITOL_NOMAD: ${{ secrets.YOUTUBE_REFRESH_TOKEN_DIJITOL_NOMAD }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          YOUTUBECLIENT_ID: ${{ secrets.YOUTUBECLIENT_ID }}
          YOUTUBECLIENT_SECTRET: ${{ secrets.YOUTUBECLIENT_SECTRET }}
        run: python validate_youtube_channels.py
