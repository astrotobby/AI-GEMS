name: FreeLLMAPI sidecar tests

on:
  pull_request:
    paths:
      - "scripts/freellmapi_sidecar.py"
      - "scripts/test_freellmapi_sidecar.py"
      - ".github/workflows/longform-youtube.yml"
      - ".github/workflows/freellmapi-sidecar-tests.yml"
      - ".github/workflows/longform-scheduler-recovery.yml"
      - ".github/scripts/reconcile_longform_schedule.py"
      - ".github/scripts/test_reconcile_longform_schedule.py"
      - ".github/scripts/merge_visual_registry.py"
      - ".github/scripts/test_merge_visual_registry.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sidecar-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile sidecar modules
        run: >-
          python -m py_compile
          scripts/freellmapi_sidecar.py
          scripts/test_freellmapi_sidecar.py
          .github/scripts/reconcile_longform_schedule.py
          .github/scripts/test_reconcile_longform_schedule.py
          .github/scripts/merge_visual_registry.py
          .github/scripts/test_merge_visual_registry.py

      - name: Run offline sidecar safety tests
        run: python -m unittest discover -s scripts -p "test_freellmapi_sidecar.py"

      - name: Run long-form scheduler recovery safety tests
        run: python -m unittest discover -s .github/scripts -p "test_reconcile_longform_schedule.py"

      - name: Run visual registry merge safety tests
        run: python -m unittest discover -s .github/scripts -p "test_merge_visual_registry.py"
