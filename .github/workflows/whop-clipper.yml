name: Whop clipper

on:
  schedule:
    # all times UTC; Kenya (EAT) = UTC+3
    - cron: "0 2 * * *"      # 05:00 EAT: plan today's 2 clipping + 2 UGC videos and make them
    - cron: "50 4 * * *"     # 07:50 EAT: finish anything left, wait, go live at 08:20
    - cron: "30 10 * * *"    # 13:30 EAT: wait, go live at 14:00
    - cron: "17 */4 * * *"   # every 4h: views, submissions, catch-up if a slot was missed
  push:   # on the feature branch: verify credentials + rank campaigns, never post or submit
    branches: [claude/whoop-clipping-automation-pdxfm6]
    paths: ["whop-clipper/**", ".github/workflows/whop-clipper.yml"]
  workflow_dispatch:
    inputs:
      command:
        description: "clipper command (run, scan, status, approve <job>, skip <job>, done <job>)"
        default: "run"
      dry_run:
        description: "clip but never publish or submit"
        type: boolean
        default: false

permissions:
  contents: write   # commit the ledger back so the next run resumes

concurrency:
  group: whop-clipper
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: whop-clipper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: whop-clipper/requirements.txt

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - run: pip install -r requirements.txt
      # Claude Code CLI: lets CLAUDE_CODE_OAUTH_TOKEN (a Claude Pro/Max plan) write scripts and pick clips
      - run: npm install -g @anthropic-ai/claude-code

      # rendered clips, downloads and whisper models survive between runs
      - uses: actions/cache@v4
        with:
          path: |
            whop-clipper/work
            ~/.cache/huggingface
          key: clipper-${{ github.run_id }}
          restore-keys: clipper-

      - name: YouTube cookies (optional)
        env:
          YTDLP_COOKIES_TXT: ${{ secrets.YTDLP_COOKIES_TXT }}
        if: env.YTDLP_COOKIES_TXT != ''
        run: printf '%s' "$YTDLP_COOKIES_TXT" > "$RUNNER_TEMP/cookies.txt"

      - name: Run clipper
        env:
          WHOP_TOKEN: ${{ secrets.WHOP_TOKEN }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLIPPER_MODE: ${{ vars.CLIPPER_MODE }}
          YTDLP_COOKIES: ${{ runner.temp }}/cookies.txt
          CMD: ${{ github.event_name == 'push' && 'check' || github.event.inputs.command || 'run' }}
          DRY: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          if [ "$CMD" = "run" ]; then
            python -m clipper run $DRY
          else
            python -m clipper $CMD
            if [ "$CMD" = "check" ]; then python -m clipper scan; fi
            # an approval should go out now, not at the next scheduled run
            case "$CMD" in approve*) python -m clipper run $DRY ;; esac
          fi
          python -m clipper status

      - name: Save ledger
        if: always() && github.event_name != 'push'
        run: |
          [ -f state/ledger.json ] || exit 0
          git config user.name "whop-clipper[bot]"
          git config user.email "whop-clipper@users.noreply.github.com"
          # The Whop connector task also writes the ledger. Merge its latest copy job-by-job
          # (newest update wins), then commit on top of the current branch tip.
          git fetch -q origin "$GITHUB_REF_NAME"
          git show "origin/$GITHUB_REF_NAME:whop-clipper/state/ledger.json" > "$RUNNER_TEMP/remote-ledger.json" 2>/dev/null || true
          python -m clipper merge-ledger "$RUNNER_TEMP/remote-ledger.json"
          git reset -q --mixed "origin/$GITHUB_REF_NAME"
          git add state/ledger.json
          git diff --cached --quiet || (git commit -m "clipper: update ledger [skip ci]" && git push origin "HEAD:$GITHUB_REF_NAME")
