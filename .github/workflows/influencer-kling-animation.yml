name: Influencer - Kling animation (isolated)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Check readiness or generate realistic content-driven video footage"
        type: choice
        options:
          - check
          - animate
        default: check
        required: true
      allow_cash_billing:
        description: "Authorize Kling to deduct monetary API balance if its billing rules prioritize balance. Leave off to block all generation."
        type: boolean
        default: false
        required: true
      content_brief:
        description: "Required video script or content brief. Footage will be generated from this content."
        type: string
        required: true
      max_jobs:
        description: "Number of 15-second content-driven video clips to generate (1-10)"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "6"
          - "8"
          - "10"
        default: "2"
        required: true

permissions:
  contents: read

concurrency:
  group: influencer-kling-production
  cancel-in-progress: false

jobs:
  animate:
    runs-on: [self-hosted, windows, influencer-runner]
    timeout-minutes: 75
    env:
      KLING_API_KEYS: ${{ secrets.KLING_API_KEYS }}
      INFLUENCER_ROOT: 'C:\Users\chanz\OneDrive\Desktop\INFLUENCER'
      PYTHONUTF8: '1'
    steps:
      - name: Checkout selected project branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Create isolated Python environment
        shell: powershell
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'influencer-venv'
          python -m venv $venv
          $py = Join-Path $venv 'Scripts\python.exe'
          & $py -m pip install --disable-pip-version-check "requests>=2.32,<3"
          if ($LASTEXITCODE -ne 0) { throw "Could not install pipeline dependencies." }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            throw "ffmpeg is required to remove generated Kling audio before narration."
          }
          "INFLUENCER_PYTHON=$py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify character-video asset and Python dependencies
        shell: powershell
        run: |
          & $env:INFLUENCER_PYTHON -c "import requests; print('PYTHON_DEPENDENCIES_OK')"
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            throw "ffprobe is required to validate the persistent character video."
          }
          if (-not (Test-Path "$env:INFLUENCER_ROOT\kling_20261124_VIDEO_Subtle_slo_4117_0.mp4")) {
            throw "Missing approved 1080p Kling character-reference video."
          }

      - name: Run isolated Kling influencer pipeline
        shell: powershell
        env:
          PIPELINE_MODE: ${{ inputs.mode }}
          ALLOW_CASH_BILLING: ${{ inputs.allow_cash_billing }}
          MAX_JOBS: ${{ inputs.max_jobs }}
          CONTENT_BRIEF: ${{ inputs.content_brief }}
        run: |
          $arguments = @("--mode", "$env:PIPELINE_MODE", "--max-jobs", "$env:MAX_JOBS", "--content-brief", "$env:CONTENT_BRIEF")
          if ($env:ALLOW_CASH_BILLING -eq "true") { $arguments += "--allow-cash-billing" }
          & $env:INFLUENCER_PYTHON scripts\influencer_kling_pipeline.py @arguments

      - name: Confirm local outputs
        if: always()
        shell: powershell
        run: |
          $out = Join-Path $env:INFLUENCER_ROOT 'Kling_Animations'
          if (Test-Path $out) {
            Get-ChildItem -LiteralPath $out -File |
              Select-Object Name, Length, LastWriteTime |
              Format-Table -AutoSize
          }
