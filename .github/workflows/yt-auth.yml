name: YouTube auth
# One-time per channel. Run 1 (code empty): sends a Google sign-in link to Telegram. Run 2: paste the
# localhost address you end up on into "code"; credentials are kept in the clipper's run cache
# (work/yt_tokens). Nothing secret is printed.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "YouTube channel title to connect"
        default: "Astro Tobby"
      code:
        description: "step 2 only: paste the full http://localhost/?code=... address your browser ended on (leave empty for step 1)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: whop-clipper
  cancel-in-progress: false

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: whop-clipper
    steps:
      - uses: actions/checkout@v4
      # start from the clipper's cache so saving a new one keeps everything it already holds
      - uses: actions/cache/restore@v4
        with:
          path: |
            whop-clipper/work
            ~/.cache/huggingface
          key: clipper-auth-restore
          restore-keys: clipper-
      - name: Sign in
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          YOUTUBECLIENT_ID: ${{ secrets.YOUTUBECLIENT_ID }}
          YOUTUBECLIENT_SECTRET: ${{ secrets.YOUTUBECLIENT_SECTRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHANNEL: ${{ inputs.channel }}
          CODE: ${{ inputs.code }}
        run: python yt_auth.py "$CHANNEL" "$CODE"
      - uses: actions/cache/save@v4
        if: success() && inputs.code != ''
        with:
          path: |
            whop-clipper/work
            ~/.cache/huggingface
          key: clipper-auth-${{ github.run_id }}
