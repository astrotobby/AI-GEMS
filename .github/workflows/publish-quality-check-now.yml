name: Publish quality-check video now

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Verified YouTube channel"
        type: choice
        required: true
        options: [astrotobby, digital_nomad]
      video_id:
        description: "Existing uploaded YouTube video ID"
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish-now:
    runs-on: ubuntu-latest
    steps:
      - name: Promote the verified channel video to public
        env:
          CHANNEL: \${{ inputs.channel }}
          VIDEO_ID: \${{ inputs.video_id }}
          YOUTUBE_REFRESH_TOKEN_ASTRO_TOBBY: \${{ secrets.YOUTUBE_REFRESH_TOKEN_ASTRO_TOBBY }}
          YOUTUBE_REFRESH_TOKEN_DIJITOL_NOMAD: \${{ secrets.YOUTUBE_REFRESH_TOKEN_DIJITOL_NOMAD }}
          YOUTUBE_CLIENT_ID: \${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: \${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          CHANNELS = {
              "astrotobby": {
                  "title": "Astro Tobby",
                  "channel_id": "UCxndvpcFaVhN1bJxgWIjG_A",
                  "token_env": "YOUTUBE_REFRESH_TOKEN_ASTRO_TOBBY",
              },
              "digital_nomad": {
                  "title": "DIJITOL NOMAD",
                  "channel_id": "UCE_cklDludc6nkU1_4K6JzA",
                  "token_env": "YOUTUBE_REFRESH_TOKEN_DIJITOL_NOMAD",
              },
          }

          def request_json(url, method="GET", data=None, headers=None):
              req = urllib.request.Request(url, data=data, headers=headers or {}, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      raw = response.read().decode("utf-8")
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")
                  raise RuntimeError(f"YouTube/Google API HTTP {exc.code}: {detail[:1200]}") from exc

          channel_key = os.environ["CHANNEL"]
          video_id = os.environ["VIDEO_ID"].strip()
          if channel_key not in CHANNELS:
              raise SystemExit("Unknown channel selection")
          if not video_id or any(ch not in "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_" for ch in video_id):
              raise SystemExit("Invalid YouTube video ID")

          target = CHANNELS[channel_key]
          refresh_token = os.environ.get(target["token_env"], "")
          client_id = os.environ.get("YOUTUBE_CLIENT_ID", "")
          client_secret = os.environ.get("YOUTUBE_CLIENT_SECRET", "")
          if not all((refresh_token, client_id, client_secret)):
              raise SystemExit(f"Missing OAuth credentials for {target['title']}")

          token_body = urllib.parse.urlencode({
              "client_id": client_id,
              "client_secret": client_secret,
              "refresh_token": refresh_token,
              "grant_type": "refresh_token",
          }).encode()
          token = request_json(
              "https://oauth2.googleapis.com/token",
              method="POST",
              data=token_body,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )
          access_token = token.get("access_token")
          if not access_token:
              raise SystemExit("Google did not return an access token")

          headers = {"Authorization": f"Bearer {access_token}", "Content-Type": "application/json"}
          identity = request_json(
              "https://www.googleapis.com/youtube/v3/channels?part=id,snippet&mine=true",
              headers=headers,
          ).get("items", [])
          if not any(item.get("id") == target["channel_id"] for item in identity):
              found = [{"title": item.get("snippet", {}).get("title"), "id": item.get("id")} for item in identity]
              raise SystemExit(f"Authenticated channel mismatch. Expected {target['channel_id']}; received {found}")

          video_data = request_json(
              "https://www.googleapis.com/youtube/v3/videos?" + urllib.parse.urlencode({
                  "part": "id,snippet,status",
                  "id": video_id,
              }),
              headers=headers,
          ).get("items", [])
          if not video_data:
              raise SystemExit(f"Video {video_id} was not returned by YouTube")
          video = video_data[0]
          actual_channel_id = (video.get("snippet") or {}).get("channelId")
          if actual_channel_id != target["channel_id"]:
              raise SystemExit(
                  f"Video belongs to channel {actual_channel_id}, not expected {target['channel_id']}; no changes made"
              )

          old_status = video.get("status") or {}
          if old_status.get("privacyStatus") == "public":
              print(json.dumps({
                  "result": "already_public",
                  "channel": target["title"],
                  "video_id": video_id,
                  "url": f"https://youtu.be/{video_id}",
              }))
              raise SystemExit(0)

          writable = (
              "license", "embeddable", "publicStatsViewable",
              "selfDeclaredMadeForKids", "containsSyntheticMedia",
          )
          new_status = {key: old_status[key] for key in writable if key in old_status}
          new_status["privacyStatus"] = "public"
          body = json.dumps({"id": video_id, "status": new_status}).encode()
          request_json(
              "https://www.googleapis.com/youtube/v3/videos?part=status",
              method="PUT",
              data=body,
              headers=headers,
          )

          verify = request_json(
              "https://www.googleapis.com/youtube/v3/videos?" + urllib.parse.urlencode({
                  "part": "id,snippet,status",
                  "id": video_id,
              }),
              headers=headers,
          ).get("items", [])
          if not verify:
              raise SystemExit("YouTube update returned but the video could not be read back")
          final_video = verify[0]
          final_status = final_video.get("status") or {}
          if final_video.get("snippet", {}).get("channelId") != target["channel_id"]:
              raise SystemExit("Post-update channel identity check failed")
          if final_status.get("privacyStatus") != "public":
              raise SystemExit(f"YouTube did not confirm public visibility: {final_status.get('privacyStatus')}")
          if final_status.get("publishAt"):
              raise SystemExit("YouTube still reports a future publishAt timestamp")

          print(json.dumps({
              "result": "public_confirmed",
              "channel": target["title"],
              "video_id": video_id,
              "title": (final_video.get("snippet") or {}).get("title"),
              "url": f"https://youtu.be/{video_id}",
              "privacy_status": final_status.get("privacyStatus"),
              "publish_at": final_status.get("publishAt"),
          }, indent=2))
          PY
