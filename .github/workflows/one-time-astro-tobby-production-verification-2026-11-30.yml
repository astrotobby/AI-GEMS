name: One-time Astro Tobby production verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-astro-tobby-production-verification-2026-11-30.yml"

permissions:
  contents: write

jobs:
  production:
    uses: ./.github/workflows/longform-youtube.yml
    with:
      channel: astrotobby
      slot: "10:00"
      target_date: "2026-11-30"
      dry_run: false
      publish_now: true
    secrets: inherit

  cleanup:
    if: always()
    needs: [production]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-time trigger
        shell: bash
        run: |
          set -euo pipefail
          FILE=".github/workflows/one-time-astro-tobby-production-verification-2026-11-30.yml"
          if [ -f "$FILE" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm "$FILE"
            git commit -m "Remove one-time production trigger [skip ci]"
            git push origin HEAD:main
          else
            echo "One-time trigger already removed."
          fi
