name: One-time DIJITOL NOMAD live verification
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-dijitol-musetalk-live.yml
permissions:
  contents: write
jobs:
  produce:
    name: Render and publish DIJITOL NOMAD
    uses: ./.github/workflows/longform-youtube.yml
    with:
      channel: digital_nomad
      slot: "12:00"
      target_date: "2026-12-05"
      dry_run: false
      publish_now: true
      cancel_stale_run: true
    secrets: inherit
  cleanup:
    if: always()
    needs: [produce]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove one-time trigger
        run: |
          set -euo pipefail
          rm -f .github/workflows/recover-dijitol-musetalk-live.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/recover-dijitol-musetalk-live.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove one-time DIJITOL trigger [skip ci]"
          git push
