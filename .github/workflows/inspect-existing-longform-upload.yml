name: Inspect existing private long-form YouTube upload

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel that owns the existing upload"
        type: choice
        required: true
        options: [astrotobby, digital_nomad]
        default: astrotobby
      job_id:
        description: "Exact long-form ledger job ID"
        type: string
        required: true
        default: "20261125_astrotobby_1000"
      video_id:
        description: "Existing YouTube video ID"
        type: string
        required: true
        default: "DXCfKFfPRtc"

permissions:
  contents: read

concurrency:
  group: longform-global-visual-history
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout AI-GEMS
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore existing channel-specific YouTube OAuth credentials
        uses: actions/cache/restore@v4
        with:
          path: |
            whop-clipper/work
            ~/.cache/huggingface
          key: clipper-auth-restore
          restore-keys: |
            clipper-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YouTube API dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2

      - name: Read existing video status (no changes)
        working-directory: whop-clipper
        env:
          CHANNEL: ${{ inputs.channel }}
          JOB_ID: ${{ inputs.job_id }}
          VIDEO_ID: ${{ inputs.video_id }}
        run: python ../.github/scripts/inspect_existing_longform_upload.py --channel "$CHANNEL" --job-id "$JOB_ID" --video-id "$VIDEO_ID"
