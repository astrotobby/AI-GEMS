name: Migrate YouTube OAuth tokens to repository secrets

# One-time migration from the legacy Actions cache into encrypted GitHub Actions secrets.
# This workflow never prints, uploads, or publishes OAuth credential values.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-oauth-secret-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.YOUTUBE_SECRETS_MIGRATION_TOKEN }}
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Restore the current OAuth cache
        uses: actions/cache/restore@v4
        with:
          path: |
            whop-clipper/work
            ~/.cache/huggingface
          key: oauth-secret-migration-${{ github.run_id }}
          restore-keys: |
            clipper-auth-

      - name: Install secret encryption dependency
        run: python -m pip install --quiet pynacl

      - name: Encrypt and persist both channel credentials
        env:
          GH_TOKEN: ${{ secrets.YOUTUBE_SECRETS_MIGRATION_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox

          owner, repo = "astrotobby", "AI-GEMS"
          token = os.environ.get("GH_TOKEN", "").strip()
          if not token:
              raise SystemExit("Missing temporary YOUTUBE_SECRETS_MIGRATION_TOKEN repository secret.")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  data=data,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")
                  raise RuntimeError(
                      f"GitHub secret API returned HTTP {exc.code}: {detail[:500]}"
                  ) from exc

          files = [
              (
                  "whop-clipper/work/yt_tokens/ASTRO_TOBBY.json",
                  "YOUTUBE_REFRESH_TOKEN_ASTRO_TOBBY",
                  "Astro Tobby",
                  "UCxndvpcFaVhN1bJxgWIjG_A",
              ),
              (
                  "whop-clipper/work/yt_tokens/DIJITOL_NOMAD.json",
                  "YOUTUBE_REFRESH_TOKEN_DIJITOL_NOMAD",
                  "DIJITOL NOMAD",
                  "UCE_cklDludc6nkU1_4K6JzA",
              ),
          ]

          _, public_key = api("GET", f"/repos/{owner}/{repo}/actions/secrets/public-key")
          key = PublicKey(base64.b64decode(public_key["key"]))
          box = SealedBox(key)

          for relative_path, secret_name, expected_channel, expected_id in files:
              path = Path(relative_path)
              if not path.is_file():
                  raise SystemExit(f"Required cached credential file is missing: {relative_path}")
              data = json.loads(path.read_text(encoding="utf-8"))
              required = ("client_id", "client_secret", "refresh_token", "channel_id")
              if not all(str(data.get(field, "")).strip() for field in required):
                  raise SystemExit(f"Credential file is incomplete for {expected_channel}; nothing printed.")
              if data.get("channel_id") != expected_id:
                  raise SystemExit(f"Channel identity mismatch for {expected_channel}; nothing persisted.")
              if str(data.get("channel", "")).strip().casefold() != expected_channel.casefold():
                  raise SystemExit(f"Channel label mismatch for {expected_channel}; nothing persisted.")

              # Save only the minimum OAuth payload. It is encrypted with GitHub's public key.
              secret_value = json.dumps(
                  {
                      "client_id": data["client_id"],
                      "client_secret": data["client_secret"],
                      "refresh_token": data["refresh_token"],
                      "channel": expected_channel,
                      "channel_id": expected_id,
                  },
                  separators=(",", ":"),
              )
              encrypted = base64.b64encode(box.encrypt(secret_value.encode("utf-8"))).decode("ascii")
              api(
                  "PUT",
                  f"/repos/{owner}/{repo}/actions/secrets/{secret_name}",
                  {"encrypted_value": encrypted, "key_id": public_key["key_id"]},
              )
              print(f"Stored encrypted repository secret: {secret_name} (channel identity checked).")

          _, listed = api("GET", f"/repos/{owner}/{repo}/actions/secrets?per_page=100")
          names = {item["name"] for item in listed.get("secrets", [])}
          required_names = {item[1] for item in files}
          if not required_names.issubset(names):
              raise SystemExit("Repository secret listing did not confirm both channel secret names.")

          # The bootstrap PAT is deliberately removed after successful migration.
          status, _ = api(
              "DELETE",
              f"/repos/{owner}/{repo}/actions/secrets/YOUTUBE_SECRETS_MIGRATION_TOKEN",
          )
          if status != 204:
              raise SystemExit("Credentials were migrated, but the temporary migration secret was not deleted.")
          print("Both encrypted channel secrets are present. Temporary migration secret deleted.")
          PY
