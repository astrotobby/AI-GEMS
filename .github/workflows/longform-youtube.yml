name: Daily long-form YouTube

on:
  schedule:
    - cron: "17 3 * * *"  # 06:17 EAT start -> next-day Astro Tobby 10:00 EAT release
    - cron: "23 5 * * *"  # 08:23 EAT start -> next-day DIJITOL NOMAD 12:00 EAT release
    - cron: "29 8 * * *"  # 11:29 EAT start -> next-day Astro Tobby 15:00 EAT release
    - cron: "37 11 * * *" # 14:37 EAT start -> next-day DIJITOL NOMAD 18:00 EAT release
  workflow_dispatch:
    inputs:
      channel:
        description: "YouTube destination"
        type: choice
        required: true
        default: astrotobby
        options: [astrotobby, digital_nomad]
      slot:
        description: "Kenya publication time"
        type: choice
        required: true
        default: "10:00"
        options: ["10:00", "12:00", "15:00", "18:00"]
      target_date:
        description: "Optional Kenya date (YYYY-MM-DD); blank means next future matching slot"
        type: string
        required: false
      dry_run:
        description: "Research, script, render and validate but DO NOT upload"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: longform-${{ github.event_name == 'schedule' && github.event.schedule || format('{0}-{1}', github.event.inputs.channel, github.event.inputs.slot) }}
  cancel-in-progress: false

jobs:
  render-and-publish:
    # Live schedule starts only after an end-to-end manual dry run is approved.
    # workflow_dispatch remains available while LONGFORM_LIVE_ENABLED is unset.
    if: ${{ github.event_name != 'schedule' || vars.LONGFORM_LIVE_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LONGFORM_STATE_DIR: ${{ github.workspace }}/whop-clipper/state/longform
      LONGFORM_MODEL: ${{ vars.LONGFORM_MODEL || 'claude-sonnet-5' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.7-flash' }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_TTS_FUNCTION_ID: ${{ vars.NVIDIA_TTS_FUNCTION_ID || '877104f7-e885-42b9-8de8-f6e4c6303969' }}
      NVIDIA_TTS_VOICE: ${{ vars.NVIDIA_TTS_VOICE || 'Magpie-Multilingual.EN-US.Jason' }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_FALLBACK_MODELS: ${{ vars.OPENCODE_FALLBACK_MODELS || 'opencode/nemotron-3.5-lightning-free,opencode/deepseek-v4.1-flash-free,opencode/mimo-v2.6-flash-free,opencode/nemotron-3.5-super-vl-free,opencode/beam-free,opencode/big-pickle' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YOUTUBE_REFRESH_TOKEN_ASTRO_TOBBY: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ASTRO_TOBBY }}
      YOUTUBE_REFRESH_TOKEN_DIJITOL_NOMAD: ${{ secrets.YOUTUBE_REFRESH_TOKEN_DIJITOL_NOMAD }}
      REFRESHTOKEN_DIJITOLNOMAD: ${{ secrets.REFRESHTOKEN_DIJITOLNOMAD }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      YOUTUBECLIENT_ID: ${{ secrets.YOUTUBECLIENT_ID }}
      YOUTUBECLIENT_SECTRET: ${{ secrets.YOUTUBECLIENT_SECTRET }}
    steps:
      - name: Checkout AI-GEMS (credential and scheduler repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore channel-specific YouTube OAuth credentials
        uses: actions/cache/restore@v4
        with:
          path: |
            whop-clipper/work
            ~/.cache/huggingface
          key: longform-yt-${{ github.run_id }}
          restore-keys: |
            clipper-auth-
      - name: Checkout astro-blog production pipeline
        uses: actions/checkout@v4
        with:
          repository: astrotobby/astro-blog
          ref: main
          path: astro-blog
          persist-credentials: false

      # This cache contains non-secret provider IDs and perceptual hashes, not credentials.
      # Keep visual no-repeat history shared by both channels across fresh cloud runners.
      - name: Restore cross-run visual asset history
        uses: actions/cache/restore@v4
        with:
          path: |
            astro-blog/.pipeline/state/footage_history.json
            astro-blog/.pipeline/state/footage_search_cache.json
          key: visual-assets-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            visual-assets-${{ github.ref_name }}-

      - name: Seed duplicate-scene exclusions and verify visual history
        working-directory: astro-blog
        run: python scripts/seed_footage_history.py --ledger ../whop-clipper/state/longform/ledger.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: astro-blog/requirements-longform.txt

      - name: Install OpenCode CLI for free-model fallback
        if: env.OPENCODE_API_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @opencode/cli
          opencode --version

      - name: Install FFmpeg
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3
        with:
          version: release
          token: ${{ github.token }}

      - name: Install long-form Python dependencies
        run: python -m pip install --disable-pip-version-check -r astro-blog/requirements-longform.txt

      - name: Resolve the channel and publication slot
        id: slot
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE_CRON" in
              "17 3 * * *") CHANNEL="astrotobby"; SLOT="10:00" ;;
              "23 5 * * *") CHANNEL="digital_nomad"; SLOT="12:00" ;;
              "29 8 * * *") CHANNEL="astrotobby"; SLOT="15:00" ;;
              "37 11 * * *") CHANNEL="digital_nomad"; SLOT="18:00" ;;
              *) echo "Unknown scheduled trigger: $GITHUB_EVENT_SCHEDULE" >&2; exit 1 ;;
            esac
            TARGET_DATE="$(TZ=Africa/Nairobi date -d tomorrow +%F)"
            DRY_RUN="false"
          else
            CHANNEL="${{ github.event.inputs.channel }}"
            SLOT="${{ github.event.inputs.slot }}"
            TARGET_DATE="${{ github.event.inputs.target_date }}"
            DRY_RUN="${{ github.event.inputs.dry_run }}"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Selected $CHANNEL / $SLOT EAT / target date ${TARGET_DATE:-next future slot} / dry-run=$DRY_RUN"

      - name: Verify expected account routing before research
        working-directory: whop-clipper
        env:
          CHANNEL: ${{ steps.slot.outputs.channel }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          if not os.environ.get("GEMINI_API_KEY"):
              raise SystemExit("Missing GEMINI_API_KEY secret in AI-GEMS. Add the existing Gemini key from astro-blog to this repository's Actions secrets.")
          channel = os.environ["CHANNEL"]
          expected = {"astrotobby": ("Astro Tobby", "goodlucktobby@gmail.com"),
                      "digital_nomad": ("DIJITOL NOMAD", "chanzera3@gmail.com")}
          name, account = expected[channel]
          cfg = tomllib.loads(Path("config.toml").read_text(encoding="utf-8"))
          targets = [t for t in cfg.get("targets", []) if t.get("platform") == "youtube"]
          target = next((t for t in targets if (t.get("channel") or "").casefold() == name.casefold()), None)
          assert target, f"Missing YouTube target: {name}"
          if channel == "digital_nomad" and target.get("channel_id") != "UCE_cklDludc6nkU1_4K6JzA":
              raise SystemExit("DIJITOL NOMAD channel ID does not match the configured owner channel")
          print(f"Destination configured: {name}; owner mapping: {account}; channel ID: {target.get('channel_id', 'not set')}")
          PY

      - name: Test FreeLLMAPI sidecar bootstrap
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          python -m py_compile scripts/freellmapi_sidecar.py scripts/test_freellmapi_sidecar.py
          python -m unittest discover -s scripts -p "test_freellmapi_sidecar.py"

      - name: Start optional FreeLLMAPI fallback for manual dry-runs
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        env:
          FREELLMAPI_ENABLED: "true"
        run: python scripts/freellmapi_sidecar.py

      - name: Run end-to-end long-form pipeline
        working-directory: whop-clipper
        env:
          CHANNEL: ${{ steps.slot.outputs.channel }}
          SLOT: ${{ steps.slot.outputs.slot }}
          TARGET_DATE: ${{ steps.slot.outputs.target_date }}
          DRY_RUN: ${{ steps.slot.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--channel "$CHANNEL" --slot "$SLOT")
          if [ -n "$TARGET_DATE" ]; then ARGS+=(--target-date "$TARGET_DATE"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python ../astro-blog/scripts/longform_pipeline.py "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/longform-result.txt"

      # Save only non-secret visual search/history files; leave OAuth and other state untouched.
      - name: Persist cross-run visual asset history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            astro-blog/.pipeline/state/footage_history.json
            astro-blog/.pipeline/state/footage_search_cache.json
          key: visual-assets-${{ github.ref_name }}-${{ github.run_id }}

      - name: Preserve rendered video and job result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longform-${{ steps.slot.outputs.channel || 'manual' }}-${{ github.run_id }}
          path: |
            astro-blog/.pipeline/out/video_16x9.mp4
            astro-blog/.pipeline/out/longform_*.json
            whop-clipper/state/longform/ledger.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Write workflow summary
        if: always()
        env:
          CHANNEL: ${{ steps.slot.outputs.channel }}
          SLOT: ${{ steps.slot.outputs.slot }}
          TARGET_DATE: ${{ steps.slot.outputs.target_date }}
          DRY_RUN: ${{ steps.slot.outputs.dry_run }}
        run: |
          {
            echo "## Long-form YouTube job"
            echo ""
            printf "%s\\n" "- Channel: ${CHANNEL}"
            printf "%s\\n" "- Publication slot: ${SLOT} Kenya time"
            printf "%s\\n" "- Target date: ${TARGET_DATE:-next future slot}"
            printf "%s\\n" "- Dry run: ${DRY_RUN}"
            echo ""
            if [ -f "$RUNNER_TEMP/longform-result.txt" ]; then
              echo '```json'
              cat "$RUNNER_TEMP/longform-result.txt"
              echo '```'
            else
              echo "Pipeline did not produce a result JSON. Check the failed step logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop and remove temporary FreeLLMAPI sidecar
        if: always()
        run: python scripts/freellmapi_sidecar.py --cleanup
