name: One-time DIJITOL NOMAD production verification (MuseTalk output fix)

on:
  push:
    paths:
      - ".github/workflows/one-time-dijitol-musetalk-output-verify-2026-12-05.yml"

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/longform-youtube.yml
    with:
      channel: digital_nomad
      slot: "12:00"
      target_date: "2026-12-05"
      dry_run: false
      publish_now: true

  cleanup:
    if: always()
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-time production trigger
        shell: bash
        run: |
          set -euo pipefail
          FILE=".github/workflows/one-time-dijitol-musetalk-output-verify-2026-12-05.yml"
          if [ ! -f "$FILE" ]; then
            echo "One-time trigger is already absent."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$FILE"
          git commit -m "Remove completed one-time DIJITOL NOMAD production trigger"
          git push origin HEAD:main
