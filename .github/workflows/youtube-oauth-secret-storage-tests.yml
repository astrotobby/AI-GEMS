name: YouTube OAuth secret-storage tests

on:
  pull_request:
    paths:
      - ".github/scripts/youtube_oauth_secret_storage.py"
      - ".github/scripts/test_youtube_oauth_secret_storage.py"
      - ".github/workflows/migrate-youtube-oauth-secrets.yml"
      - ".github/workflows/longform-youtube.yml"
      - ".github/workflows/yt-auth.yml"
      - ".github/workflows/youtube-oauth-secret-storage-tests.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/youtube_oauth_secret_storage.py"
      - ".github/scripts/test_youtube_oauth_secret_storage.py"
      - ".github/workflows/migrate-youtube-oauth-secrets.yml"
      - ".github/workflows/longform-youtube.yml"
      - ".github/workflows/yt-auth.yml"
      - ".github/workflows/youtube-oauth-secret-storage-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline secret-storage tests
        run: python .github/scripts/test_youtube_oauth_secret_storage.py
