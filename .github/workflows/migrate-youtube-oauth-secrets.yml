name: Migrate YouTube OAuth credentials to encrypted repository secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-oauth-secret-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout AI-GEMS
        uses: actions/checkout@v4

      - name: Restore the existing YouTube OAuth cache
        uses: actions/cache/restore@v4
        with:
          path: |
            whop-clipper/work
            ~/.cache/huggingface
          key: youtube-oauth-migration-\${{ github.run_id }}
          restore-keys: |
            clipper-auth-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GitHub secret encryption dependency
        run: python -m pip install --disable-pip-version-check pynacl

      - name: Validate both Google accounts and store encrypted repository secrets
        env:
          YOUTUBE_SECRETS_MIGRATION_TOKEN: \${{ secrets.YOUTUBE_SECRETS_MIGRATION_TOKEN }}
          GITHUB_REPOSITORY: \${{ github.repository }}
        run: python .github/scripts/youtube_oauth_secret_storage.py --persist-all
