name: Influencer - Kling animation (isolated)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Check API eligibility without spending credits, or animate the two approved scenes"
        type: choice
        options:
          - check
          - animate
        default: check
        required: true
      allow_cash_billing:
        description: "Authorize Kling to deduct monetary API balance if its billing rules prioritize balance. Leave off to block all generation."
        type: boolean
        default: false
        required: true
      max_jobs:
        description: "Maximum scene animations in this batch (1 or 2)"
        type: choice
        options:
          - "1"
          - "2"
        default: "1"
        required: true

permissions:
  contents: read

concurrency:
  group: influencer-kling-production
  cancel-in-progress: false

jobs:
  animate:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, influencer-runner]
    timeout-minutes: 75
    env:
      KLING_API_KEYS: ${{ secrets.KLING_API_KEYS }}
      INFLUENCER_ROOT: 'C:\Users\chanz\OneDrive\Desktop\INFLUENCER'
      PYTHONUTF8: '1'
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Create isolated Python environment
        shell: powershell
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'influencer-venv'
          python -m venv $venv
          $py = Join-Path $venv 'Scripts\python.exe'
          & $py -m pip install --disable-pip-version-check "requests>=2.32,<3" "Pillow>=10,<13"
          if ($LASTEXITCODE -ne 0) { throw "Could not install pipeline dependencies." }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            throw "ffmpeg is required to remove generated Kling audio before narration."
          }
          "INFLUENCER_PYTHON=$py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify local assets and Python dependencies
        shell: powershell
        run: |
          & $env:INFLUENCER_PYTHON -c "import requests, PIL; print('PYTHON_DEPENDENCIES_OK')"
          if (-not (Test-Path "$env:INFLUENCER_ROOT\Kling_Animations\ApprovedImages\master_studio_reference.jpg")) {
            throw "Missing approved master studio image."
          }
          if (-not (Test-Path "$env:INFLUENCER_ROOT\Kling_Animations\ApprovedImages\office_studio_reference.jpg")) {
            throw "Missing approved office studio image."
          }
          if (-not (Test-Path "$env:INFLUENCER_ROOT\kling_20261124_VIDEO_Subtle_slo_4117_0.mp4")) {
            throw "Missing local Kling motion reference."
          }

      - name: Run isolated Kling influencer pipeline
        shell: powershell
        env:
          PIPELINE_MODE: ${{ inputs.mode }}
          ALLOW_CASH_BILLING: ${{ inputs.allow_cash_billing }}
          MAX_JOBS: ${{ inputs.max_jobs }}
        run: |
          $arguments = @("--mode", "$env:PIPELINE_MODE", "--credential-index", "1", "--max-jobs", "$env:MAX_JOBS")
          if ($env:ALLOW_CASH_BILLING -eq "true") { $arguments += "--allow-cash-billing" }
          & $env:INFLUENCER_PYTHON scripts\influencer_kling_pipeline.py @arguments

      - name: Confirm local outputs
        if: always()
        shell: powershell
        run: |
          $out = Join-Path $env:INFLUENCER_ROOT 'Kling_Animations'
          if (Test-Path $out) {
            Get-ChildItem -LiteralPath $out -File |
              Select-Object Name, Length, LastWriteTime |
              Format-Table -AutoSize
          }
