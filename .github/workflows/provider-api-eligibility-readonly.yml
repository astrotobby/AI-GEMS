name: Runware account check (read-only)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/provider-api-eligibility-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY || secrets.RUNWARE_API }}
    steps:
      - name: Read Runware account balance without generating
        shell: bash
        run: |
          python - <<'PY'
          import json, os, uuid, urllib.request, urllib.error

          key = os.environ.get("RUNWARE_API_KEY", "").strip()
          if not key:
              print("RUNWARE_CREDENTIAL_NOT_CONFIGURED")
              raise SystemExit(2)

          request = [{
              "taskType": "accountManagement",
              "taskUUID": str(uuid.uuid4()),
              "operation": "getDetails"
          }]
          req = urllib.request.Request(
              "https://api.runware.ai/v1",
              data=json.dumps(request).encode("utf-8"),
              headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  payload = json.loads(response.read().decode("utf-8"))
                  print(f"RUNWARE_HTTP_STATUS={response.status}")
          except urllib.error.HTTPError as exc:
              print(f"RUNWARE_HTTP_STATUS={exc.code}")
              print("Runware rejected the credential or account read request.")
              raise SystemExit(3)
          except Exception as exc:
              print(f"RUNWARE_NETWORK_ERROR={type(exc).__name__}")
              raise SystemExit(4)

          first = payload[0] if isinstance(payload, list) and payload else payload
          if not isinstance(first, dict) or first.get("taskType") != "accountManagement":
              print("RUNWARE_RESPONSE_UNEXPECTED")
              raise SystemExit(5)

          print(f"RUNWARE_ACCOUNT_NAME={first.get('organizationName', 'not returned')}")
          print(f"RUNWARE_BALANCE_USD={first.get('balance', 'not returned')}")
          usage = first.get("usage", {})
          today = usage.get("today", {}) if isinstance(usage, dict) else {}
          print(f"RUNWARE_TODAY_CREDITS_USED={today.get('credits', 'not returned')}")
          print(f"RUNWARE_TODAY_REQUESTS={today.get('requests', 'not returned')}")
          print("NO_VIDEO_GENERATION_OR_BILLING_ACTION_PERFORMED")
          PY
