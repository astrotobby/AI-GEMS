name: One-time DIJITOL MuseTalk final quality sample

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-dijitol-musetalk-final-sample.yml"

permissions:
  contents: write

jobs:
  render-and-publish:
    uses: ./.github/workflows/longform-youtube.yml
    with:
      channel: digital_nomad
      slot: "12:00"
      target_date: "2026-11-30"
      dry_run: false
      publish_now: true
    secrets: inherit

  remove-one-time-trigger:
    if: always()
    needs: [render-and-publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Remove the one-time trigger after the production attempt
        uses: actions/github-script@v7
        with:
          script: |
            const path = ".github/workflows/one-time-dijitol-musetalk-final-sample.yml";
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: "main"
            });
            if (Array.isArray(data) || !data.sha) {
              core.warning("One-time trigger file was not found; nothing to remove.");
              return;
            }
            const result = await github.rest.repos.deleteFile({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "cleanup: remove one-time DIJITOL final sample trigger",
              sha: data.sha,
              branch: "main"
            });
            core.info("One-time trigger removed in commit " + result.data.commit.sha);
